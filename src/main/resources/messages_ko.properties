# 한국어 번들. 키 규약은 error.<ErrorCode 상수명>.

# order
error.ORDER_NOT_FOUND=주문을 찾을 수 없습니다: {0}
error.INVALID_ORDER_STATUS=주문 {0}이(가) {1} 상태여서 요청을 처리할 수 없습니다
error.ORDER_DUPLICATE=채널 {0}의 주문이 이미 등록되어 있습니다: {1}
error.ORDER_STORE_CLOSED=매장 {0}이(가) 주문을 받을 수 없는 상태입니다
error.ORDER_OUT_OF_DELIVERY_AREA=배달 주소가 배달 가능 지역을 벗어났습니다
error.ORDER_MENU_UNAVAILABLE=메뉴 {0}이(가) 현재 주문 불가 상태입니다
error.ORDER_PRICE_MISMATCH=주문 금액 {0}이(가) 계산된 금액 {1}과(와) 일치하지 않습니다
error.ORDER_MIN_AMOUNT_NOT_MET=주문 금액 {0}이(가) 최소 주문 금액 {1} 미만입니다
error.ORDER_CANCEL_WINDOW_EXPIRED=주문 {0}은(는) 더 이상 취소할 수 없습니다

# common (요청 형식)
error.VALIDATION_FAILED=입력값 검증에 실패했습니다
error.MALFORMED_REQUEST=요청 본문을 해석할 수 없습니다
error.INVALID_PARAMETER=유효하지 않은 파라미터입니다: {0}
error.MISSING_PARAMETER=필수 파라미터가 누락되었습니다: {0}
error.METHOD_NOT_ALLOWED=이 엔드포인트에서 허용되지 않는 HTTP 메서드입니다
error.ENDPOINT_NOT_FOUND=요청한 엔드포인트가 존재하지 않습니다
error.UNSUPPORTED_MEDIA_TYPE=지원하지 않는 Content-Type입니다: {0}
error.NOT_ACCEPTABLE=요청한 응답 형식(Accept)을 제공할 수 없습니다
error.PAYLOAD_TOO_LARGE=업로드 크기가 허용치를 초과했습니다
error.REQUEST_REJECTED=요청이 거부되었습니다 ({0})

# common (인증/인가)
error.AUTH_REQUIRED=인증이 필요합니다
error.AUTH_TOKEN_EXPIRED=토큰이 만료되었습니다
error.AUTH_TOKEN_INVALID=유효하지 않은 토큰입니다
error.ACCESS_DENIED=접근 권한이 없습니다

# common (서버)
error.INTERNAL_ERROR=서버 내부 오류가 발생했습니다
error.SERVICE_UNAVAILABLE=서비스를 일시적으로 이용할 수 없습니다. 잠시 후 다시 시도해 주세요
error.UPSTREAM_ERROR=연동 서비스에서 오류가 발생했습니다
error.UPSTREAM_TIMEOUT=연동 서비스의 응답이 지연되고 있습니다
