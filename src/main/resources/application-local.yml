# 로컬 개발 전용. 프로파일 미지정 실행(bootRun, 테스트)에 적용됨(spring.profiles.default=local).
logging:
  level:
    # 요청/응답 본문 로깅(RequestLoggingFilter DEBUG 모드). 로컬에서만 켬.
    com.example.skeleton.common.filter.RequestLoggingFilter: debug
    # 인증 문제를 추적할 때 주석 해제.
    # org.springframework.security: debug

