# 기본(폴백) 영어 번들. 키 규약은 error.<ErrorCode 상수명>.
# 새 ErrorCode 상수를 추가하면 여기와 messages_ko.properties 양쪽에 등록 필요함(ErrorCodeMessageBundleTest가 강제).

# order
error.ORDER_NOT_FOUND=Order not found: {0}
error.INVALID_ORDER_STATUS=Cannot {2} order {0} in status {1}
error.ORDER_DUPLICATE=Order already registered from channel {0}: {1}
error.ORDER_STORE_CLOSED=Store {0} is not open for orders
error.ORDER_OUT_OF_DELIVERY_AREA=The delivery address is outside the service area
error.ORDER_MENU_UNAVAILABLE=Menu {0} is currently unavailable
error.ORDER_PRICE_MISMATCH=Order total {0} does not match the calculated total {1}
error.ORDER_MIN_AMOUNT_NOT_MET=Order total {0} is below the minimum order amount {1}
error.ORDER_CANCEL_WINDOW_EXPIRED=Order {0} can no longer be cancelled

# common (요청 형식)
error.VALIDATION_FAILED=Validation failed
error.MALFORMED_REQUEST=Malformed request body
error.INVALID_PARAMETER=Invalid parameter: {0}
error.MISSING_PARAMETER=Missing required parameter: {0}
error.METHOD_NOT_ALLOWED=HTTP method not allowed for this endpoint
error.ENDPOINT_NOT_FOUND=The requested endpoint does not exist
error.UNSUPPORTED_MEDIA_TYPE=Unsupported content type: {0}
error.NOT_ACCEPTABLE=The requested response format (Accept) is not available
error.PAYLOAD_TOO_LARGE=The upload exceeds the maximum allowed size
error.REQUEST_REJECTED=The request was rejected ({0})

# common (인증/인가)
error.AUTH_REQUIRED=Authentication is required
error.AUTH_TOKEN_EXPIRED=Token has expired
error.AUTH_TOKEN_INVALID=The provided token is invalid
error.ACCESS_DENIED=Access denied

# common (서버)
error.INTERNAL_ERROR=An unexpected error occurred
error.SERVICE_UNAVAILABLE=The service is temporarily unavailable. Please try again later
error.UPSTREAM_ERROR=A dependent service failed to respond correctly
error.UPSTREAM_TIMEOUT=A dependent service did not respond in time
